<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>{{SLIDE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --base-color:    #F9F9F9;
      --text-color:    #1A1A1A;
      --main-color:    #0071BC;
      --accent-color:  #FF5050;

      --font-size-title:   50pt;
      --font-size-heading: 35pt;
      --font-size-body:    25pt;

      --margin-edge: 48px; /* 0.5in @ 96dpi */
      --slide-w: 1920px;
      --slide-h: 1080px;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: var(--slide-w);
      height: var(--slide-h);
      overflow: hidden;
      background: var(--base-color);
      color: var(--text-color);
      font-family: 'Noto Sans JP', 'Inter', 'Meiryo', 'Yu Gothic UI', sans-serif;
      font-size: var(--font-size-body);
      line-height: 1.5;
    }

    /* ===== Slide Container ===== */
    .slide {
      width: var(--slide-w);
      height: var(--slide-h);
      padding: var(--margin-edge);
      display: flex;
      flex-direction: column;
      background: var(--base-color);
      position: relative;
    }

    /* ===== Typography ===== */
    .slide-title {
      font-size: var(--font-size-title);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.4em;
    }

    .slide-heading {
      font-size: var(--font-size-heading);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.3em;
    }

    .slide-body {
      font-size: var(--font-size-body);
      font-weight: 400;
      line-height: 1.6;
    }

    /* ===== Emphasis Hierarchy ===== */
    /* Priority 1: underline */
    .emp-u {
      text-decoration: underline;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.15em;
    }

    /* Priority 2: invert (text/background swap) */
    .emp-inv {
      background: var(--text-color);
      color: var(--base-color);
      padding: 0 0.2em;
      border-radius: 2px;
    }

    /* Priority 3: main color — use sparingly */
    .emp-main {
      color: var(--main-color);
      font-weight: 700;
    }

    /* Priority 4: accent color — use only for negative/alert — use very sparingly */
    .emp-accent {
      color: var(--accent-color);
      font-weight: 700;
    }

    /* ===== Table (horizontal lines only — NO vertical lines) ===== */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: var(--font-size-body);
    }

    th, td {
      border: none;
      border-bottom: 1px solid var(--text-color);
      padding: 0.4em 0.6em;
      text-align: left;
    }

    thead th {
      border-bottom-width: 2px;
      font-weight: 700;
    }

    table tr:last-child td {
      border-bottom: 2px solid var(--text-color);
    }

    /* ===== Icons ===== */
    .icon {
      width: 80px;
      height: 80px;
      display: inline-block;
      vertical-align: middle;
    }

    .icon-lg {
      width: 120px;
      height: 120px;
    }

    .icon-sm {
      width: 48px;
      height: 48px;
    }

    /* currentColor icons (decorative / generic) */
    .icon-theme {
      filter: invert(27%) sepia(90%) saturate(1200%) hue-rotate(186deg) brightness(95%) contrast(95%);
      /* approximates #0071BC — use only on mono variant icons */
    }

    .icon-accent {
      filter: invert(41%) sepia(90%) saturate(2000%) hue-rotate(330deg) brightness(105%) contrast(95%);
      /* approximates #FF5050 */
    }

    /* Brand icons: do NOT apply .icon-theme / .icon-accent */
    .icon-brand { /* no filter — original brand colors preserved */ }

    /* ===== Divider ===== */
    hr.slide-divider {
      border: none;
      border-top: 2px solid var(--text-color);
      margin: 0.6em 0;
    }

    /* ===== Layout Helpers ===== */
    .row {
      display: flex;
      flex-direction: row;
      gap: 40px;
      align-items: flex-start;
    }

    .col {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
    }

    .spacer { flex: 1; }

    /* ===== Slide Number ===== */
    .slide-number {
      position: absolute;
      bottom: var(--margin-edge);
      right: var(--margin-edge);
      font-size: 18pt;
      color: var(--text-color);
      opacity: 0.4;
    }

    /* ===== Print: 1 slide = 1 page (1920×1080) ===== */
    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      html, body { overflow: visible; transform: none !important; }
      .slide { page-break-after: always; }
    }

    /* ===== Screen scale-fit for smaller viewports ===== */
    @media screen and (max-width: 1920px) {
      body {
        transform-origin: top left;
        transform: scale(calc(100vw / 1920));
      }
    }
  </style>
</head>
<body>
  <!--
    USAGE:
      Copy this file as slide-01.html, slide-02.html, etc.
      Edit the content inside <section class="slide"> only.
      Do NOT add external CSS/JS files — keep everything inline.
      Maximum 3 lines of text per slide.
      Use icons from ../cache/icons/{slug}/{variant}.svg
  -->

  <section class="slide">

    <!-- ========== SLIDE CONTENT START ========== -->

    <h1 class="slide-title">{{SLIDE_TITLE}}</h1>
    <hr class="slide-divider">

    <div class="slide-body">
      <!-- Replace with your content. Keep to 3 lines max. -->
      <p>{{LINE_1}}</p>
      <p>{{LINE_2}}</p>
      <p>{{LINE_3}}</p>
    </div>

    <!-- ========== SLIDE CONTENT END ========== -->

    <div class="slide-number">{{SLIDE_NUMBER}}</div>

  </section>

  <script>
    /* Wait for fonts before rendering to avoid FOUC */
    document.fonts.ready.then(function () {
      document.body.classList.add('fonts-ready');
    });
  </script>
</body>
</html>
