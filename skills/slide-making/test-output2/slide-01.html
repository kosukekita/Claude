<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #F9F9F9;
      font-family: 'Noto Sans JP', 'Meiryo', sans-serif;
      color: #1A1A1A;
    }

    .slide {
      width: 1920px; height: 1080px;
      padding: 72px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #F9F9F9;
    }

    .steps-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
    }

    .step-card {
      flex: 0 0 400px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      padding: 38px 32px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      height: 620px;
      position: relative;
    }

    .step-num {
      width: 80px; height: 80px;
      background: #0071BC;
      color: #fff;
      border-radius: 50%;
      font-size: 38pt;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .step-icon {
      width: 150px; height: 150px;
      display: flex; align-items: center; justify-content: center;
      order: 3;
      position: relative;
    }
    .step-icon svg { width: 130px; height: 130px; }
    .step-card:nth-child(1) .step-icon svg line:nth-of-type(n+2) { display: none; }
    .step-card:nth-child(1) .step-icon::after {
      content: "";
      position: absolute;
      left: 44px;
      bottom: 48px;
      width: 10px;
      height: 18px;
      background: #0071BC;
      box-shadow: 18px -14px 0 #0071BC, 36px -33px 0 #0071BC;
    }
    .step-card:nth-child(5) .step-icon {
      background: center / 142px 142px no-repeat url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150' fill='none' stroke='%230071BC' stroke-width='1.55' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(11 15) scale(4.05)'><path d='M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z'/><circle cx='12' cy='12' r='3'/></g><g transform='translate(92 83) scale(2.03)'><path d='M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z'/><circle cx='12' cy='12' r='3'/></g></svg>");
    }
    .step-card:nth-child(5) .step-icon svg { visibility: hidden; }
    .step-card:nth-child(3) .step-icon {
      background: center / 140px 140px no-repeat url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150' fill='none' stroke='%230071BC' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'><rect x='31' y='28' width='79' height='106' rx='4'/><path d='M56 28v-5c0-5 4-9 9-9h10c5 0 9 4 9 9v5'/><path d='M48 28h45v11H48z'/><path d='m47 61 7 7 12-14M75 63h19M47 86l7 7 12-14M75 88h18M47 111l7 7 12-14'/><path d='M84 111 118 77l12 12-34 34-18 6z'/><path d='m116 79 12-12 12 12-11 11'/></svg>");
    }
    .step-card:nth-child(3) .step-icon svg { visibility: hidden; }

    .step-title {
      font-size: 34pt;
      font-weight: 900;
      text-align: center;
      color: #1A1A1A;
      line-height: 1.2;
      order: 2;
    }
    .step-body {
      font-size: 15pt;
      width: 100%;
      border-top: 3px solid #0071BC;
      margin-top: 28px;
      padding: 26px 0 0;
      text-align: left;
      color: #1A1A1A;
      line-height: 1.65;
      order: 4;
    }

    .arrow {
      flex-shrink: 0;
      width: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow svg { display: none; }
    .arrow::before {
      content: "";
      width: 64px;
      height: 64px;
      background: #0071BC;
      clip-path: polygon(0 32%, 56% 32%, 56% 0, 100% 50%, 56% 100%, 56% 68%, 0 68%);
    }

    .slide-number {
      position: absolute;
      bottom: 32px; right: 48px;
      font-size: 18pt; opacity: 0.35;
    }
  </style>
</head>
<body>
  <section class="slide">
    <div class="steps-row">

      <div class="step-card">
        <div class="step-num">1</div>
        <div class="step-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="42" cy="42" r="28" stroke="#0071BC" stroke-width="7"/>
            <line x1="62" y1="62" x2="85" y2="85" stroke="#0071BC" stroke-width="7" stroke-linecap="round"/>
            <line x1="32" y1="42" x2="52" y2="42" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="42" y1="32" x2="42" y2="52" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-title">現状分析</div>
        <div class="step-body">現状の業務・システムを可視化し、<br>課題と改善機会を特定します。</div>
      </div>

      <div class="arrow">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 24H40M40 24L28 12M40 24L28 36" stroke="#0071BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="step-card">
        <div class="step-num">2</div>
        <div class="step-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="15" width="60" height="70" rx="6" stroke="#0071BC" stroke-width="7"/>
            <line x1="33" y1="38" x2="67" y2="38" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="33" y1="52" x2="67" y2="52" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="33" y1="66" x2="52" y2="66" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-title">PoC設計</div>
        <div class="step-body">検証目的・範囲・成功指標を策定し、<br>PoCの計画と検証方法を設計します。</div>
      </div>

      <div class="arrow">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 24H40M40 24L28 12M40 24L28 36" stroke="#0071BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="step-card">
        <div class="step-num">3</div>
        <div class="step-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="22" stroke="#0071BC" stroke-width="7"/>
            <circle cx="50" cy="50" r="8" fill="#0071BC"/>
            <line x1="50" y1="12" x2="50" y2="22" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="50" y1="78" x2="50" y2="88" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="12" y1="50" x2="22" y2="50" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="78" y1="50" x2="88" y2="50" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="step-title">本番実装</div>
        <div class="step-body">PoCの成果を踏まえ、要件を確定し、<br>本番環境への実装と連携を行います。</div>
      </div>

      <div class="arrow">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 24H40M40 24L28 12M40 24L28 36" stroke="#0071BC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="step-card">
        <div class="step-num">4</div>
        <div class="step-icon">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="15,75 35,55 50,62 65,40 85,25" stroke="#0071BC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <polyline points="72,25 85,25 85,38" stroke="#0071BC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div class="step-title">継続改善</div>
        <div class="step-body">効果を測定・評価し、改善を継続することで、<br>成果の最大化を図ります。</div>
      </div>

    </div>
    <div class="slide-number">1</div>
  </section>
</body>
</html>
