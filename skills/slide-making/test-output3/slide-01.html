<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #F9F9F9;
      font-family: "Noto Sans JP", "Meiryo", sans-serif;
      color: #1A1A1A;
    }
    .slide {
      width: 1920px; height: 1080px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 36px 60px 0;
      position: relative; background: #F9F9F9;
    }
    .steps-row {
      display: flex; flex-direction: row;
      align-items: center; justify-content: center;
      gap: 0; width: 100%;
    }
    .step-card {
      flex: 1; background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.11);
      padding: 38px 30px 42px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
      height: 820px;
    }
    .step-num {
      width: 94px; height: 94px;
      background: #0071BC; color: #fff;
      border-radius: 50%; font-size: 48pt; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .step-title {
      font-size: 40pt; font-weight: 900;
      text-align: center; color: #1A1A1A;
      line-height: 1.2; flex-shrink: 0;
    }
    .step-icon {
      flex: 1; width: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .step-icon img { width: 300px; height: 300px; object-fit: contain; }
    .arrow {
      flex-shrink: 0; width: 80px;
      display: flex; align-items: center; justify-content: center;
    }
    .arrow img { width: 56px; height: 42px; }
    .slide-number {
      position: absolute; bottom: 28px; right: 44px;
      font-size: 16pt; opacity: 0.30;
    }
  </style>
</head>
