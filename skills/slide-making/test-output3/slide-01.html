<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --base-color: #F9F9F9;
      --text-color: #1A1A1A;
      --main-color: #0071BC;
      --accent-color: #FF5050;
      --font-size-title: 50pt;
      --font-size-heading: 35pt;
      --font-size-body: 25pt;
      --margin-edge: 48px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden; margin: 0; padding: 0;
      background: var(--base-color); color: var(--text-color);
      font-family: 'Noto Sans JP', 'Meiryo', sans-serif;
    }
    .slide {
      width: 1920px; height: 1080px; padding: 48px 80px 48px 80px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start;
      position: relative;
    }
    .slide-title {
      font-size: 52pt; font-weight: 900; color: var(--main-color);
      margin: 0 0 8px 0; letter-spacing: 0.04em; text-align: center;
    }
    .slide-subtitle {
      font-size: 22pt; font-weight: 400; color: #555;
      margin: 0 0 48px 0; text-align: center;
    }
    .cards-row {
      display: flex; flex-direction: row;
      align-items: center; justify-content: center;
      gap: 0; width: 100%; flex: 1;
    }
    .card {
      display: flex; flex-direction: column; align-items: center;
      background: #fff; border-radius: 16px;
      width: 380px; align-self: stretch;
      padding: 44px 28px 40px;
      position: relative;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      justify-content: center;
    }
    .badge {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--main-color); color: #fff;
      font-size: 30pt; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
    }
    .card-icon {
      margin-top: 44px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: center;
      width: 120px; height: 120px;
    }
    .card-label {
      font-size: 20pt; font-weight: 400; color: #888;
      margin: 0 0 8px 0; text-align: center;
    }
    .card-text {
      font-size: 30pt; font-weight: 900; color: var(--text-color);
      text-align: center; margin: 0;
    }
    .arrow {
      display: flex; align-items: center; justify-content: center;
      width: 60px; flex-shrink: 0;
    }
    /* SVG icon sizing guard */
    .card-icon svg { width: 110px !important; height: 110px !important; }
  </style>
</head>
<body>
  <section class="slide">
    <div>
      <h1 class="slide-title">成果につなげる 4つのステップ</h1>
      <p class="slide-subtitle">現状を正しく把握し、課題を特定、最適な施策を立案し、確実に実行します。</p>
    </div>

    <div class="cards-row">
      <!-- Card 1 -->
      <div class="card">
        <div class="badge">1</div>
        <div class="card-icon">
          <!-- 棒グラフ+虫眼鏡アイコン -->
          <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- bars -->
            <rect x="8" y="60" width="18" height="36" fill="#0071BC"/>
            <rect x="32" y="40" width="18" height="56" fill="#0071BC"/>
            <rect x="56" y="22" width="18" height="74" fill="#0071BC"/>
            <!-- magnifier circle -->
            <circle cx="78" cy="32" r="22" stroke="#0071BC" stroke-width="6" fill="none"/>
            <!-- magnifier handle -->
            <line x1="94" y1="48" x2="108" y2="62" stroke="#0071BC" stroke-width="6" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="card-label">Step 1:</p>
        <p class="card-text">現状分析</p>
      </div>

      <!-- Arrow -->
      <div class="arrow">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <path d="M12 24 H36 M28 14 L38 24 L28 34" stroke="#0071BC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="badge">2</div>
        <div class="card-icon">
          <!-- ターゲット/サイトアイコン -->
          <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="55" cy="55" r="46" stroke="#0071BC" stroke-width="6"/>
            <circle cx="55" cy="55" r="30" stroke="#0071BC" stroke-width="6"/>
            <circle cx="55" cy="55" r="14" stroke="#0071BC" stroke-width="6"/>
            <line x1="55" y1="2" x2="55" y2="18" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="55" y1="92" x2="55" y2="108" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="2" y1="55" x2="18" y2="55" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="92" y1="55" x2="108" y2="55" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="card-label">Step 2:</p>
        <p class="card-text">課題特定</p>
      </div>

      <!-- Arrow -->
      <div class="arrow">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <path d="M12 24 H36 M28 14 L38 24 L28 34" stroke="#0071BC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div class="badge">3</div>
        <div class="card-icon">
          <!-- クリップボード+ペンアイコン -->
          <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- clipboard body -->
            <rect x="18" y="18" width="66" height="82" rx="6" stroke="#0071BC" stroke-width="6" fill="none"/>
            <!-- clip top -->
            <rect x="38" y="10" width="34" height="16" rx="4" stroke="#0071BC" stroke-width="5" fill="none"/>
            <!-- lines -->
            <line x1="32" y1="50" x2="78" y2="50" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <line x1="32" y1="65" x2="78" y2="65" stroke="#0071BC" stroke-width="5" stroke-linecap="round"/>
            <!-- pen -->
            <path d="M72 72 L88 56 L96 64 L80 80 Z" fill="#0071BC"/>
            <line x1="72" y1="72" x2="68" y2="84" stroke="#0071BC" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="card-label">Step 3:</p>
        <p class="card-text">施策立案</p>
      </div>

      <!-- Arrow -->
      <div class="arrow">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <path d="M12 24 H36 M28 14 L38 24 L28 34" stroke="#0071BC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Card 4 -->
      <div class="card">
        <div class="badge">4</div>
        <div class="card-icon">
          <!-- ランニングマンアイコン -->
          <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- head -->
            <circle cx="72" cy="18" r="12" fill="#0071BC"/>
            <!-- body/torso -->
            <path d="M62 30 L50 58 L36 80" stroke="#0071BC" stroke-width="7" stroke-linecap="round"/>
            <!-- arm back -->
            <path d="M56 42 L30 38" stroke="#0071BC" stroke-width="7" stroke-linecap="round"/>
            <!-- arm front -->
            <path d="M58 48 L80 52" stroke="#0071BC" stroke-width="7" stroke-linecap="round"/>
            <!-- leg front -->
            <path d="M50 58 L70 78 L80 92" stroke="#0071BC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- leg back -->
            <path d="M46 62 L30 82" stroke="#0071BC" stroke-width="7" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="card-label">Step 4:</p>
        <p class="card-text">実行</p>
      </div>
    </div>

    <div style="position:absolute;bottom:48px;right:48px;font-size:18pt;opacity:0.4;">1</div>
  </section>
</body>
</html>
