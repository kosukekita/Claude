<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>AI導入の4ステップ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --base-color: #F9F9F9;
      --text-color: #1A1A1A;
      --main-color: #0071BC;
      --accent-color: #FF5050;
      --font-size-title: 50pt;
      --font-size-heading: 35pt;
      --font-size-body: 25pt;
      --margin-edge: 48px;
      --slide-w: 1920px;
      --slide-h: 1080px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: var(--base-color); color: var(--text-color);
      font-family: 'Noto Sans JP', 'Inter', 'Meiryo', sans-serif;
    }
    .slide {
      width: 1920px; height: 1080px;
      padding: var(--margin-edge);
      display: flex; flex-direction: column;
      background: var(--base-color); position: relative;
    }
    .slide-title {
      font-size: var(--font-size-title);
      font-weight: 900; line-height: 1.2;
      margin-bottom: 8px;
      border-left: 8px solid var(--main-color);
      padding-left: 24px;
    }
    .slide-divider {
      border: none; border-top: 2px solid var(--text-color);
      margin: 16px 0 48px 0;
    }
    .steps-row {
      display: flex; flex-direction: row;
      gap: 32px; align-items: stretch;
      flex: 1;
    }
    .step-card {
      flex: 1; background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .step-card::after {
      content: '→';
      position: absolute; right: -28px; top: 50%;
      transform: translateY(-50%);
      font-size: 36px; color: var(--main-color);
      font-weight: 700; z-index: 1;
    }
    .step-card:last-child::after { display: none; }
    .step-num {
      width: 64px; height: 64px;
      background: var(--main-color); color: #fff;
      border-radius: 50%;
      font-size: 32pt; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .step-title {
      font-size: var(--font-size-heading);
      font-weight: 700; text-align: center;
      margin-bottom: 16px; color: var(--text-color);
    }
    .step-body {
      font-size: var(--font-size-body);
      text-align: center; color: #555;
      line-height: 1.5;
    }
    .emp-u { text-decoration: underline; text-underline-offset: 0.15em; }
    .slide-number {
      position: absolute; bottom: var(--margin-edge); right: var(--margin-edge);
      font-size: 18pt; opacity: 0.4;
    }
  </style>
</head>
<body>
  <section class="slide">
    <h1 class="slide-title">AI導入の<span class="emp-u">4ステップ</span></h1>
    <hr class="slide-divider">
    <div class="steps-row">
      <div class="step-card">
        <div class="step-num">1</div>
        <div class="step-title">現状分析</div>
        <div class="step-body">業務プロセスと<br>データ資産の棚卸し</div>
      </div>
      <div class="step-card">
        <div class="step-num">2</div>
        <div class="step-title">PoC設計</div>
        <div class="step-body">優先課題を絞り込み<br>小規模で検証</div>
      </div>
      <div class="step-card">
        <div class="step-num">3</div>
        <div class="step-title">本番実装</div>
        <div class="step-body">既存システムへの<br>統合・連携</div>
      </div>
      <div class="step-card">
        <div class="step-num">4</div>
        <div class="step-title">継続改善</div>
        <div class="step-body">KPIモニタリングと<br>モデル再学習</div>
      </div>
    </div>
    <div class="slide-number">1</div>
  </section>
</body>
</html>
